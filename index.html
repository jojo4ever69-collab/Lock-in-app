<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lock In</title>
  <meta name="description" content="Film a focus timelapse without draining your battery, then track your sessions the way Strava tracks runs.">
  <meta name="theme-color" content="#0c0c0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lock In">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view"></main>

  <nav id="tabs" aria-label="Main">
    <a href="#/record" data-tab="record">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/></svg>
      <span>Record</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="2.5"/><path d="M7 20h10"/><path d="M10.5 8.2v4.6l3.8-2.3z" fill="currentColor"/></svg>
      <span>History</span>
    </a>
    <a href="#/friends" data-tab="friends">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19l5-6 4 3 4-6 5 4"/><circle cx="21" cy="14" r="0.6" fill="currentColor"/></svg>
      <span>Friends</span>
    </a>
    <a href="#/profile" data-tab="profile">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20.2a7 7 0 0 1 14 0"/></svg>
      <span>You</span>
    </a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <noscript>Lock In needs JavaScript to run.</noscript>
</body>
</html>
